<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proceso Financiero</title>
    <link rel="stylesheet" href="../style.css">
    <link type="text/css" href="../Styles/sign.css" rel="stylesheet">
</head>
<body>

    <header class="topbar">
        <div class="topbar-logo">
            <img src="../Images/Header.png" alt="Header">
        </div>
    </header>

    <main class="content-page">
        <section class="card-panel">
            <h2>Resumen financiero</h2>
            <p>Revise las asignaturas seleccionadas y el valor total a pagar.</p>

            <table class="subjects-table">
                <thead>
                    <tr>
                        <th>Asignatura</th>
                        <th>Profesor</th>
                        <th>Créditos</th>
                    </tr>
                </thead>
                <tbody id="tablaFinanciera">
                </tbody>
            </table>

            <div class="summary-box">
                <p><strong>Total de créditos:</strong> <span id="creditosFinales">0</span></p>
                <p><strong>Valor por crédito:</strong> <span id="valorCredito">$180.000</span></p>
                <p><strong>Total a pagar:</strong> <span id="totalPagar">$0</span></p>
            </div>

            <div class="button-row">
                <button type="button" id="btnPagar">Pagar</button>
            </div>
        </section>
    </main>

    <script src="financiero.js"></script>
</body>
</html>
